<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="x5-orientation" content="landscape" />
  <meta name="x5-fullscreen" content="true" />
  <meta name="x5-page-mode" content="app" />

  <meta name="format-detection" content="telephone=no" />
  <title>ZOMBIE SANDBOX</title>
  <script>
    // ====== Phaser 多源加载器: 本地 -> jsdelivr -> unpkg -> cdnjs ======
    (function () {
      var sources = [
        '/vendor/phaser.min.js',
        'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js',
        'https://unpkg.com/phaser@3.80.1/dist/phaser.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js'
      ];
      var idx = 0;
      var startTs = Date.now();
      function tryLoad() {
        if (idx >= sources.length) {
          document.getElementById('loader-status').innerHTML =
            '<span style="color:#ef4444">✖ Phaser 加载失败，请检查网络</span>';
          return;
        }
        var src = sources[idx++];
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = function () {
          var t = Date.now() - startTs;
          document.getElementById('loader-status').innerHTML =
            '<span style="color:#22c55e">✓ Phaser 已加载</span>' +
            '<span style="color:#666;margin-left:8px">(' + src.split('/')[2] || 'local' + ' · ' + t + 'ms)</span>';
          // 启动游戏
          var g = document.createElement('script');
          g.src = '/js/game.js';
          document.head.appendChild(g);
        };
        s.onerror = function () {
          tryLoad();
        };
        document.head.appendChild(s);
      }
      // DOM ready 后启动
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', tryLoad);
      } else {
        tryLoad();
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --black: #0a0a0a;
      --black-2: #141414;
      --line: #1f1f1f;
      --line-2: #2a2a2a;
      --text: #e0e0e0;
      --muted: #666666;
      --green: #22c55e;
      --green-dark: #15803d;
      --red: #ef4444;
      --red-dark: #991b1b;
    }
    html, body {
      font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, -apple-system, monospace;
      background: var(--black);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      width: 100dvw;
      display: flex;
      flex-direction: column;
      letter-spacing: 0.02em;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    /* 强制横屏提示遮罩 */
    #orient-mask {
      display: none;
      position: fixed; inset: 0; z-index: 99999;
      background: var(--black); color: var(--text);
      justify-content: center; align-items: center; flex-direction: column;
      text-align: center; padding: 30px;
    }
    #orient-mask.show { display: flex; }
    #orient-mask .icon {
      font-size: 64px; margin-bottom: 20px;
      animation: spin-phone 1.5s ease-in-out infinite;
    }
    @keyframes spin-phone {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }
    #orient-mask h3 { font-size: 16px; letter-spacing: 0.2em; margin-bottom: 8px; color: var(--red); }
    #orient-mask p { font-size: 12px; color: var(--muted); line-height: 1.6; }

    /* Loader */
    #loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--black); z-index: 99998;
    }
    #loader.done { opacity: 0; pointer-events: none; transition: opacity 0.4s; }
    #loader-box { text-align: center; }
    #loader-title {
      font-size: 14px; letter-spacing: 0.4em; color: var(--red);
      margin-bottom: 14px; font-weight: 700;
    }
    #loader-bar-wrap {
      width: 180px; height: 2px; background: var(--line-2);
      overflow: hidden; margin: 0 auto 14px;
    }
    #loader-bar {
      width: 0%; height: 100%; background: var(--green);
      animation: loader-anim 1.2s ease-in-out infinite;
    }
    @keyframes loader-anim {
      0% { width: 0; margin-left: 0; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 0; margin-left: 100%; }
    }
    #loader-status {
      font-size: 10px; letter-spacing: 0.15em; color: var(--muted);
    }

    /* ====== Toolbar ====== */
    #toolbar {
      background: var(--black);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
      font-size: 12px;
      flex-shrink: 0;
    }
    .toolbar-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding-right: 14px;
      border-right: 1px solid var(--line);
      white-space: nowrap;
    }
    .tool-group {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .tool-group-label {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-right: 3px;
      white-space: nowrap;
    }
    .tool-btn {
      padding: 6px 10px;
      border: 1px solid var(--line-2);
      background: var(--black);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.05em;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      -webkit-user-select: none;
      white-space: nowrap;
    }
    .tool-btn:active { transform: scale(0.97); }
    .tool-btn:hover { border-color: var(--text); }
    .tool-btn.active {
      background: var(--green);
      border-color: var(--green);
      color: var(--black);
    }
    .tool-btn.zombie-normal.active,
    .tool-btn.zombie-fast.active,
    .tool-btn.zombie-tank.active {
      background: var(--red);
      border-color: var(--red);
      color: var(--black);
    }
    .tool-btn.survivor-male { border-color: var(--green-dark); }
    .tool-btn.survivor-male:hover { border-color: var(--green); }
    .tool-btn.survivor-female { border-color: var(--green-dark); }
    .tool-btn.survivor-female:hover { border-color: var(--green); }
    .tool-btn.zombie-normal { border-color: var(--red-dark); }
    .tool-btn.zombie-normal:hover { border-color: var(--red); }
    .tool-btn.zombie-fast { border-color: var(--red-dark); }
    .tool-btn.zombie-fast:hover { border-color: var(--red); }
    .tool-btn.zombie-tank { border-color: var(--red-dark); }
    .tool-btn.zombie-tank:hover { border-color: var(--red); }

    .tool-icon {
      width: 7px;
      height: 7px;
      display: inline-block;
      flex-shrink: 0;
    }
    .icon-sm { background: var(--green); }
    .icon-sf { background: var(--green); }
    .icon-zn { background: var(--red); }
    .icon-zf { background: var(--red); }
    .icon-zt { background: var(--red); }

    .divider {
      width: 1px;
      height: 20px;
      background: var(--line);
      flex-shrink: 0;
    }
    .control-btn {
      padding: 6px 10px;
      border: 1px solid var(--line-2);
      background: var(--black);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.05em;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
      white-space: nowrap;
      -webkit-user-select: none;
    }
    .control-btn:active { transform: scale(0.97); }
    .control-btn:hover { border-color: var(--text); }
    .control-btn.danger {
      border-color: var(--red-dark);
      color: var(--red);
    }
    .control-btn.danger:active,
    .control-btn.danger:hover {
      background: var(--red);
      color: var(--black);
      border-color: var(--red);
    }
    /* NPC 台词模式切换 (segmented control: OFF / TPL / LLM) */
    .bark-seg {
      display: inline-flex;
      border: 1px solid var(--line-2);
      background: var(--black);
    }
    .bark-seg button {
      padding: 6px 8px;
      border: none;
      background: var(--black);
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.05em;
      transition: color 0.12s, background 0.12s;
      -webkit-user-select: none;
    }
    .bark-seg button + button { border-left: 1px solid var(--line-2); }
    .bark-seg button:active { transform: scale(0.97); }
    .bark-seg button.active { background: var(--green-dark); color: #fff; }
    .bark-seg button.active[data-mode="off"]  { background: var(--line-2); color: var(--text); }
    .bark-seg button.active[data-mode="llm"]  { background: #1e3a5f; color: #93c5fd; }

    /* 横屏全屏按钮 (移动端高亮) */
    .control-btn.landscape {
      border-color: var(--green-dark);
      color: var(--green);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .control-btn.landscape:active,
    .control-btn.landscape:hover {
      background: var(--green);
      color: var(--black);
      border-color: var(--green);
    }

    /* ====== Game Area ====== */
    #game-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--black);
      min-height: 0;
    }
    #status-bar {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--black);
      border: 1px solid var(--line);
      padding: 10px 14px;
      font-size: 10px;
      letter-spacing: 0.08em;
      min-width: 140px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }
    .status-row + .status-row {
      border-top: 1px solid var(--line);
      margin-top: 2px;
      padding-top: 4px;
    }
    .status-label {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.15em;
    }
    .status-value {
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .status-value.survivors { color: var(--green); }
    .status-value.zombies { color: var(--red); }
    .status-value.dead { color: var(--muted); }

    #asset-hint {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: var(--black);
      border: 1px solid var(--line);
      padding: 8px 10px;
      font-size: 9px;
      color: var(--muted);
      max-width: 360px;
      letter-spacing: 0.03em;
      line-height: 1.6;
    }
    #asset-hint strong {
      color: var(--green);
      font-weight: 700;
      letter-spacing: 0.1em;
    }
    #asset-hint code {
      color: var(--text);
      background: var(--black-2);
      padding: 1px 3px;
      border: 1px solid var(--line);
      font-size: 9px;
    }

    #tooltip {
      position: absolute;
      pointer-events: none;
      background: var(--black);
      border: 1px solid var(--red);
      color: var(--text);
      padding: 3px 6px;
      font-size: 9px;
      display: none;
      z-index: 100;
    }

    /* ====== 移动端适配 ====== */
    @media (max-width: 768px), (pointer: coarse) {
      #toolbar { padding: 8px 10px; gap: 8px; }
      .toolbar-title { font-size: 11px; letter-spacing: 0.15em; padding-right: 10px; }
      .tool-btn { padding: 8px 8px; font-size: 9px; gap: 4px; }
      .control-btn { padding: 8px 8px; font-size: 9px; }
      .tool-group-label { display: none; }
      .divider { height: 18px; }
      #status-bar {
        top: 8px; right: 8px;
        padding: 7px 10px; min-width: 110px;
      }
      #asset-hint {
        font-size: 8px; max-width: 260px;
        padding: 6px 8px; left: 6px; bottom: 6px;
      }
      /* 手机端不使用悬浮球 + 悬浮球面板（始终显示顶部 toolbar） */
      #fab, #fab-panel { display: none !important; }
    }
    /* 小屏手机:标题隐藏,图标-only按钮 */
    @media (max-width: 560px) {
      .toolbar-title { display: none; }
      .tool-btn span:not(.tool-icon) { display: none; }
      .tool-btn { padding: 10px 8px; }
      .tool-icon { width: 10px; height: 10px; }
      #status-bar { font-size: 9px; }
    }
    /* 横屏手机:更紧凑 */
    @media (max-height: 500px) and (orientation: landscape) {
      #toolbar { padding: 5px 10px; gap: 6px; }
      .tool-btn, .control-btn { padding: 4px 8px; font-size: 9px; }
      #status-bar { padding: 5px 10px; }
    }
    /* ====== 强制横屏 fallback (iOS Safari / 不支持 orientation lock 的浏览器) ====== */
    html.force-landscape, html.force-landscape body {
      width: 100vh !important;
      height: 100vw !important;
      overflow: hidden !important;
      position: fixed !important;
      top: 0; left: 0;
    }
    html.force-landscape body {
      transform: rotate(90deg);
      transform-origin: bottom left;
      position: absolute;
      top: -100vw;
      left: 0;
      width: 100vh;
      height: 100vw;
    }
    html.force-landscape #orient-mask.show { display: none !important; }
    html.force-landscape-ccw, html.force-landscape-ccw body {
      width: 100vh !important;
      height: 100vw !important;
      overflow: hidden !important;
      position: fixed !important;
    }
    html.force-landscape-ccw body {
      transform: rotate(-90deg);
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 100vh;
      width: 100vh;
      height: 100vw;
    }
    html.force-landscape-ccw #orient-mask.show { display: none !important; }

    /* ====== 隐藏原顶栏 (进入悬浮球模式后): 使用 fixed + translateY 移出，不改变 game-container 尺寸 ====== */
    body.hide-toolbar #toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      transform: translateY(-200%);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }
    /* 顶栏隐藏后,游戏容器不再留padding-top */
    body.hide-toolbar {
      padding-top: 0 !important;
    }
    body.hide-toolbar #game-container {
      top: 0 !important;
      height: 100vh !important;
      padding-top: 0 !important;
    }
    body.hide-toolbar #asset-hint {
      display: none;
    }
    /* 隐藏竖屏提示当处于悬浮球模式 */
    body.hide-toolbar #orient-mask.show { display: none !important; }

    /* ====== 悬浮球 ====== */
    #fab {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(145deg, #0f0f0f, #1c1c1c);
      color: var(--green);
      border: 2px solid var(--green);
      box-shadow: 0 4px 14px rgba(34,197,94,0.35), 0 0 0 1px rgba(34,197,94,0.15) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2147483646;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, opacity 0.2s ease;
      opacity: 0;
      pointer-events: none;
      font-family: inherit;
    }
    #fab.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #fab:active { transform: scale(0.92); }
    #fab.badge::before {
      content: '';
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      background: var(--red);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--red);
    }

    /* ====== 浮动面板 ====== */
    #fab-panel {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 480px;
      max-height: calc(100vh - 24px);
      background: rgba(10,10,10,0.96);
      border: 1.5px solid var(--green);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(34,197,94,0.1);
      z-index: 2147483647;
      padding: 14px;
      color: var(--text);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transform: translateY(-20px) scale(0.96);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.18s ease, opacity 0.18s ease;
      font-family: inherit;
    }
    #fab-panel.open {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }
    #fab-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(34,197,94,0.25);
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.5px;
      font-size: 14px;
    }
    #fab-panel-close {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 28px;
      line-height: 1;
      padding: 0 6px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    #fab-panel-close:active { color: var(--red); }

    .fab-section { margin-bottom: 14px; }
    .fab-section:last-of-type { margin-bottom: 8px; }

    .fab-section-title {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1.2px;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .fab-btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .fab-btn-row:last-child { margin-bottom: 0; }

    .fab-btn {
      flex: 1 1 auto;
      min-width: 80px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      background: #111;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
      white-space: nowrap;
    }
    .fab-btn:active, .fab-btn.active {
      border-color: var(--green);
      color: var(--green);
      background: rgba(34,197,94,0.08);
      box-shadow: 0 0 0 2px rgba(34,197,94,0.15);
    }
    .fab-btn.landscape {
      background: linear-gradient(180deg, rgba(34,197,94,0.18), rgba(34,197,94,0.06));
      border-color: var(--green);
      color: var(--green);
    }
    .fab-btn.danger {
      border-color: rgba(239,68,68,0.5);
      color: var(--red);
    }
    .fab-btn.danger:active {
      background: rgba(239,68,68,0.1);
      box-shadow: 0 0 0 2px rgba(239,68,68,0.2);
    }

    /* ====== CAMERA 方向键面板 (D-PAD) ====== */
    #fab-cam-dpad {
      display: grid;
      grid-template-rows: repeat(3, auto);
      justify-items: center;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 4px;
      user-select: none;
      -webkit-user-select: none;
    }
    #fab-cam-dpad .fab-cam-mid-row {
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 6px;
      align-items: center;
    }
    .fab-cam-btn {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 1.5px solid rgba(34,197,94,0.35);
      background: linear-gradient(180deg, rgba(34,197,94,0.14), rgba(34,197,94,0.04));
      color: var(--green);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 0.08s, background 0.1s, box-shadow 0.1s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .fab-cam-btn.center {
      width: 52px; height: 52px;
      border-radius: 50%;
      border-color: rgba(239,68,68,0.45);
      background: linear-gradient(180deg, rgba(239,68,68,0.14), rgba(239,68,68,0.04));
      color: var(--red);
    }
    .fab-cam-btn:active {
      transform: translateY(1px) scale(0.94);
      background: rgba(34,197,94,0.22);
      box-shadow: 0 0 0 2px rgba(34,197,94,0.2);
    }
    .fab-cam-btn.center:active {
      background: rgba(239,68,68,0.2);
      box-shadow: 0 0 0 2px rgba(239,68,68,0.2);
    }
    /* 移动端小屏缩小方向键 */
    @media (max-width: 768px), (pointer: coarse) {
      .fab-cam-btn { width: 42px; height: 42px; font-size: 17px; }
      .fab-cam-btn.center { width: 46px; height: 46px; }
    }
    /* 持续按住高亮 */
    .fab-cam-btn.is-held {
      background: rgba(34,197,94,0.35);
      box-shadow: 0 0 0 3px rgba(34,197,94,0.3) inset;
    }
    .fab-cam-btn.center.is-held {
      background: rgba(239,68,68,0.32);
      box-shadow: 0 0 0 3px rgba(239,68,68,0.3) inset;
    }

    /* 悬浮球面板里的类型按钮激活态和toolbar一致（继承色） */
    .fab-btn.survivor-male.active   { border-color: var(--green);   color: var(--green); }
    .fab-btn.survivor-female.active { border-color: #f472b6;        color: #f472b6; }
    .fab-btn.zombie-normal.active   { border-color: #60a5fa;        color: #60a5fa; }
    .fab-btn.zombie-fast.active     { border-color: #f59e0b;        color: #f59e0b; }
    .fab-btn.zombie-tank.active     { border-color: var(--red);     color: var(--red); }

    #fab-panel-hint {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed rgba(34,197,94,0.2);
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: 0.3px;
    }

    /* 按钮点击态小动画 */
    .landscape-loading::after {
      content: '';
      display: inline-block;
      width: 10px; height: 10px;
      margin-left: 6px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: rot 0.6s linear infinite;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Loader -->
  <div id="loader">
    <div id="loader-box">
      <div id="loader-title">&#9760; ZOMBIE SANDBOX</div>
      <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
      <div id="loader-status">正在加载游戏引擎...</div>
    </div>
  </div>

  <!-- 竖屏提示遮罩 -->
  <div id="orient-mask">
    <div class="icon">&#128241;</div>
    <h3>请横屏使用</h3>
    <p>为获得最佳体验<br/>请将手机旋转至横向模式<br/>或点击上方 [↻ 横屏全屏] 按钮</p>
  </div>

  <div id="toolbar">
    <span class="toolbar-title">&#9760; Zombie Sandbox</span>

    <div class="tool-group">
      <span class="tool-group-label">SURV</span>
      <button class="tool-btn survivor-male" data-type="survivor_male" title="Male Survivor [1]">
        <span class="tool-icon icon-sm"></span><span>MALE</span>
      </button>
      <button class="tool-btn survivor-female" data-type="survivor_female" title="Female Survivor [2]">
        <span class="tool-icon icon-sf"></span><span>FEMALE</span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="tool-group">
      <span class="tool-group-label">ZOMB</span>
      <button class="tool-btn zombie-normal" data-type="zombie_normal" title="Normal Zombie [3]">
        <span class="tool-icon icon-zn"></span><span>NORMAL</span>
      </button>
      <button class="tool-btn zombie-fast" data-type="zombie_fast" title="Fast Zombie [4]">
        <span class="tool-icon icon-zf"></span><span>FAST</span>
      </button>
      <button class="tool-btn zombie-tank" data-type="zombie_tank" title="Tank Zombie [5]">
        <span class="tool-icon icon-zt"></span><span>TANK</span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="tool-group">
      <button class="control-btn landscape" id="btn-landscape" title="横屏全屏">
        &#8635; <span>LANDSCAPE</span>
      </button>
      <button class="control-btn" id="btn-pause">&#9646;&#9646; <span>PAUSE</span></button>
      <button class="control-btn" id="btn-speed">&#9654;&#9654; <span>1X</span></button>
    </div>
    <div class="tool-group">
      <button class="control-btn" id="btn-zoomout" title="缩小 (Scroll Down / −)">&#8722; <span>Z−</span></button>
      <button class="control-btn" id="btn-zoomin" title="放大 (Scroll Up / +)">&#43; <span>Z+</span></button>
      <button class="control-btn" id="btn-resetview" title="重置视角 (R / Home)">&#127919; <span>VIEW</span></button>
      <button class="control-btn danger" id="btn-clear">&#215; <span>CLEAR</span></button>
      <button class="control-btn danger" id="btn-clear-zombies">&#9760; <span>PURGE</span></button>
    </div>
    <div class="divider"></div>
    <div class="tool-group">
      <span class="tool-group-label">NPC</span>
      <div class="bark-seg" id="bark-mode-seg">
        <button data-mode="off" title="关闭所有 NPC 台词">OFF</button>
        <button data-mode="template" title="仅用模板台词 (默认, 0 延迟)">TPL</button>
        <button data-mode="llm" title="模板 + 本地 0.5B 小模型增强台词">LLM</button>
      </div>
    </div>
  </div>

  <div id="game-container">
    <div id="status-bar">
      <div class="status-row"><span class="status-label">SURVIVORS</span><span class="status-value survivors" id="count-survivors">0</span></div>
      <div class="status-row"><span class="status-label">ZOMBIES</span><span class="status-value zombies" id="count-zombies">0</span></div>
      <div class="status-row"><span class="status-label">DEAD</span><span class="status-value dead" id="count-dead">0</span></div>
      <div class="status-row"><span class="status-label">COMBAT</span><span class="status-value" id="count-fights">0</span></div>
    </div>
    <div id="asset-hint">
      <strong>NOTE</strong> &mdash; 点击上方 [SURV/ZOMB] 按钮选择角色，再点击场景放置。<br/>
      移动端点击 <span style="color:var(--green)">[&#8635; LANDSCAPE]</span> 进入横屏全屏。
    </div>
    <div id="tooltip"></div>
  </div>

  <!-- 悬浮球 (横屏模式下显示) -->
  <button id="fab" type="button" aria-label="展开菜单" title="展开菜单">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <!-- 浮动面板 (从悬浮球展开，包含所有toolbar按钮) -->
  <div id="fab-panel" aria-hidden="true">
    <div id="fab-panel-header">
      <span>&#9760; Zombie Sandbox</span>
      <button id="fab-panel-close" type="button" aria-label="关闭">&times;</button>
    </div>

    <div class="fab-section">
      <div class="fab-section-title">SURVIVORS</div>
      <div class="fab-btn-row">
        <button class="fab-btn survivor-male" data-type="survivor_male">
          <span class="tool-icon icon-sm"></span><span>MALE</span>
        </button>
        <button class="fab-btn survivor-female" data-type="survivor_female">
          <span class="tool-icon icon-sf"></span><span>FEMALE</span>
        </button>
      </div>
    </div>

    <div class="fab-section">
      <div class="fab-section-title">ZOMBIES</div>
      <div class="fab-btn-row">
        <button class="fab-btn zombie-normal" data-type="zombie_normal">
          <span class="tool-icon icon-zn"></span><span>NORMAL</span>
        </button>
        <button class="fab-btn zombie-fast" data-type="zombie_fast">
          <span class="tool-icon icon-zf"></span><span>FAST</span>
        </button>
        <button class="fab-btn zombie-tank" data-type="zombie_tank">
          <span class="tool-icon icon-zt"></span><span>TANK</span>
        </button>
      </div>
    </div>

    <div class="fab-section">
      <div class="fab-section-title">CONTROLS</div>
      <div class="fab-btn-row">
        <button class="fab-btn landscape" id="fab-btn-landscape">
          &#8635; <span>LANDSCAPE</span>
        </button>
        <button class="fab-btn" id="fab-btn-pause">
          &#9646;&#9646; <span>PAUSE</span>
        </button>
        <button class="fab-btn" id="fab-btn-speed">
          &#9654;&#9654; <span>1X</span>
        </button>
      </div>
      <div class="fab-btn-row">
        <button class="fab-btn" id="fab-btn-resetview" title="重置视角 (R/Home)">
          &#127919; <span>RESET VIEW</span>
        </button>
      </div>
      <div class="fab-btn-row">
        <button class="fab-btn danger" id="fab-btn-clear">
          &#215; <span>CLEAR ALL</span>
        </button>
        <button class="fab-btn danger" id="fab-btn-clear-zombies">
          &#9760; <span>PURGE</span>
        </button>
      </div>
    </div>

    <!-- ============ CAMERA 面板: 缩放按钮 + 方向键（手机端无键盘时操作摄像机）============ -->
    <div class="fab-section">
      <div class="fab-section-title">CAMERA</div>
      <!-- 缩放按钮行 -->
      <div class="fab-btn-row">
        <button class="fab-btn" id="fab-btn-zoomout" title="缩小 (−)">
          &#8722; <span>ZOOM OUT</span>
        </button>
        <button class="fab-btn" id="fab-btn-zoomin" title="放大 (+)">
          &#43; <span>ZOOM IN</span>
        </button>
      </div>
      <!-- 方向键: 9 宫格布局（中心空，8向）简化为 4 方向 + 中键重置 -->
      <div id="fab-cam-dpad">
        <button class="fab-cam-btn up" id="fab-btn-cam-up" title="向上 (W/↑)">▲</button>
        <div class="fab-cam-mid-row">
          <button class="fab-cam-btn left" id="fab-btn-cam-left" title="向左 (A/←)">◀</button>
          <button class="fab-cam-btn center" id="fab-btn-cam-center" title="回中心">◎</button>
          <button class="fab-cam-btn right" id="fab-btn-cam-right" title="向右 (D/→)">▶</button>
        </div>
        <button class="fab-cam-btn down" id="fab-btn-cam-down" title="向下 (S/↓)">▼</button>
      </div>
    </div>

    <div id="fab-panel-hint">横屏游玩时点击左上角悬浮球呼出菜单</div>
  </div>
</body>
</html>
