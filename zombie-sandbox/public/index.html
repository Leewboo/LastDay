<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZOMBIE SANDBOX</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0a;
      --black-2: #141414;
      --line: #1f1f1f;
      --line-2: #2a2a2a;
      --text: #e0e0e0;
      --muted: #666666;
      --green: #22c55e;
      --green-dark: #15803d;
      --red: #ef4444;
      --red-dark: #991b1b;
    }
    html, body {
      font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
      background: var(--black);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      letter-spacing: 0.02em;
    }

    /* ====== Toolbar ====== */
    #toolbar {
      background: var(--black);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
      font-size: 12px;
    }
    .toolbar-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding-right: 20px;
      border-right: 1px solid var(--line);
    }
    .tool-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .tool-group-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-right: 4px;
    }
    .tool-btn {
      padding: 7px 12px;
      border: 1px solid var(--line-2);
      background: var(--black);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    .tool-btn:hover {
      border-color: var(--text);
    }
    .tool-btn.active {
      background: var(--green);
      border-color: var(--green);
      color: var(--black);
    }
    .tool-btn.zombie-normal.active,
    .tool-btn.zombie-fast.active,
    .tool-btn.zombie-tank.active {
      background: var(--red);
      border-color: var(--red);
      color: var(--black);
    }
    .tool-btn.survivor-male { border-color: var(--green-dark); }
    .tool-btn.survivor-male:hover { border-color: var(--green); }
    .tool-btn.survivor-female { border-color: var(--green-dark); }
    .tool-btn.survivor-female:hover { border-color: var(--green); }
    .tool-btn.zombie-normal { border-color: var(--red-dark); }
    .tool-btn.zombie-normal:hover { border-color: var(--red); }
    .tool-btn.zombie-fast { border-color: var(--red-dark); }
    .tool-btn.zombie-fast:hover { border-color: var(--red); }
    .tool-btn.zombie-tank { border-color: var(--red-dark); }
    .tool-btn.zombie-tank:hover { border-color: var(--red); }

    .tool-icon {
      width: 8px;
      height: 8px;
      display: inline-block;
    }
    .icon-sm { background: var(--green); }
    .icon-sf { background: var(--green); }
    .icon-zn { background: var(--red); }
    .icon-zf { background: var(--red); }
    .icon-zt { background: var(--red); }

    .divider {
      width: 1px;
      height: 22px;
      background: var(--line);
    }
    .control-btn {
      padding: 7px 11px;
      border: 1px solid var(--line-2);
      background: var(--black);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
    }
    .control-btn:hover {
      border-color: var(--text);
    }
    .control-btn.danger {
      border-color: var(--red-dark);
      color: var(--red);
    }
    .control-btn.danger:hover {
      background: var(--red);
      color: var(--black);
      border-color: var(--red);
    }

    /* ====== Game Area ====== */
    #game-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--black);
    }
    #status-bar {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--black);
      border: 1px solid var(--line);
      padding: 14px 18px;
      font-size: 11px;
      letter-spacing: 0.08em;
      min-width: 170px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
    }
    .status-row + .status-row {
      border-top: 1px solid var(--line);
      margin-top: 3px;
      padding-top: 6px;
    }
    .status-label {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.15em;
    }
    .status-value {
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .status-value.survivors { color: var(--green); }
    .status-value.zombies { color: var(--red); }
    .status-value.dead { color: var(--muted); }

    #asset-hint {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: var(--black);
      border: 1px solid var(--line);
      padding: 10px 14px;
      font-size: 10px;
      color: var(--muted);
      max-width: 420px;
      letter-spacing: 0.03em;
      line-height: 1.6;
    }
    #asset-hint strong {
      color: var(--green);
      font-weight: 700;
      letter-spacing: 0.1em;
    }
    #asset-hint code {
      color: var(--text);
      background: var(--black-2);
      padding: 1px 4px;
      border: 1px solid var(--line);
      font-size: 10px;
    }

    #tooltip {
      position: absolute;
      pointer-events: none;
      background: var(--black);
      border: 1px solid var(--red);
      color: var(--text);
      padding: 4px 8px;
      font-size: 10px;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span class="toolbar-title">&#9760; Zombie Sandbox</span>

    <div class="tool-group">
      <span class="tool-group-label">SURVIVORS</span>
      <button class="tool-btn survivor-male" data-type="survivor_male" title="Male Survivor [1]">
        <span class="tool-icon icon-sm"></span>MALE
      </button>
      <button class="tool-btn survivor-female" data-type="survivor_female" title="Female Survivor [2]">
        <span class="tool-icon icon-sf"></span>FEMALE
      </button>
    </div>

    <div class="divider"></div>

    <div class="tool-group">
      <span class="tool-group-label">ZOMBIES</span>
      <button class="tool-btn zombie-normal" data-type="zombie_normal" title="Normal Zombie [3]">
        <span class="tool-icon icon-zn"></span>NORMAL
      </button>
      <button class="tool-btn zombie-fast" data-type="zombie_fast" title="Fast Zombie [4]">
        <span class="tool-icon icon-zf"></span>FAST
      </button>
      <button class="tool-btn zombie-tank" data-type="zombie_tank" title="Tank Zombie [5]">
        <span class="tool-icon icon-zt"></span>TANK
      </button>
    </div>

    <div class="divider"></div>

    <div class="tool-group">
      <button class="control-btn" id="btn-pause">&#9646;&#9646; PAUSE</button>
      <button class="control-btn" id="btn-speed">&#9654;&#9654; 1X</button>
      <button class="control-btn danger" id="btn-clear">&#215; CLEAR ALL</button>
      <button class="control-btn danger" id="btn-clear-zombies">&#9760; PURGE Z</button>
    </div>
  </div>

  <div id="game-container">
    <div id="status-bar">
      <div class="status-row"><span class="status-label">SURVIVORS</span><span class="status-value survivors" id="count-survivors">0</span></div>
      <div class="status-row"><span class="status-label">ZOMBIES</span><span class="status-value zombies" id="count-zombies">0</span></div>
      <div class="status-row"><span class="status-label">DEAD</span><span class="status-value dead" id="count-dead">0</span></div>
      <div class="status-row"><span class="status-label">COMBAT</span><span class="status-value" id="count-fights">0</span></div>
    </div>
    <div id="asset-hint">
      <strong>NOTE</strong> &mdash; Extract your sprite assets into
      <code>public/assets/sprites/</code> sub-folders to replace the generated placeholders.
    </div>
    <div id="tooltip"></div>
  </div>

  <script src="/js/game.js"></script>
</body>
</html>
